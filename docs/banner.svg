<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="QuickEMS — Employee Management System">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <circle cx="1080" cy="90" r="290" fill="url(#glow)"/>
  <circle cx="1180" cy="330" r="140" fill="#22d3ee" opacity="0.06" filter="url(#soft)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="82" fill="#a5b4fc" font-size="17" font-weight="600" letter-spacing="4.5">FULL-STACK PORTFOLIO PROJECT</text>
    <text x="76" y="172" fill="#ffffff" font-size="82" font-weight="800" letter-spacing="-2">QuickEMS</text>
    <text x="82" y="216" fill="#cbd5e1" font-size="27" font-weight="400" letter-spacing="0.5">Employee Management System</text>
    <text x="82" y="250" fill="#94a3b8" font-size="17" font-weight="400">People ops · Attendance · Leave · Payroll</text>

    <g transform="translate(82, 286)">
      <rect width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="56" y="22" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">React 19</text>

      <rect x="124" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="183" y="22" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Express 5</text>

      <rect x="254" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="310" y="22" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">MongoDB</text>

      <rect x="378" width="106" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="431" y="22" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Inngest</text>

      <rect x="496" width="124" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="558" y="22" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Tailwind 4</text>
    </g>
  </g>

  <!-- Decorative product surface -->
  <g transform="translate(792, 58)">
    <rect width="408" height="244" rx="22" fill="#0f172a" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="24" y="24" width="86" height="10" rx="5" fill="#818cf8" fill-opacity="0.9"/>
    <rect x="24" y="48" width="160" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>

    <rect x="24" y="78" width="108" height="64" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="44" y="96" width="38" height="7" rx="3.5" fill="#94a3b8" fill-opacity="0.8"/>
    <rect x="44" y="114" width="62" height="11" rx="5.5" fill="#ffffff" fill-opacity="0.85"/>

    <rect x="148" y="78" width="108" height="64" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="168" y="96" width="42" height="7" rx="3.5" fill="#94a3b8" fill-opacity="0.8"/>
    <rect x="168" y="114" width="48" height="11" rx="5.5" fill="#ffffff" fill-opacity="0.85"/>

    <rect x="272" y="78" width="112" height="64" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="292" y="96" width="34" height="7" rx="3.5" fill="#94a3b8" fill-opacity="0.8"/>
    <rect x="292" y="114" width="58" height="11" rx="5.5" fill="#22d3ee" fill-opacity="0.9"/>

    <rect x="24" y="158" width="360" height="62" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <g transform="translate(44, 176)">
      <rect width="116" height="8" rx="4" fill="#ffffff" fill-opacity="0.28"/>
      <rect y="18" width="76" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.12"/>
    </g>
    <g transform="translate(292, 172)">
      <rect width="72" height="30" rx="15" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.35"/>
      <circle cx="18" cy="15" r="4" fill="#4ade80"/>
      <text x="31" y="20" fill="#86efac" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700">ACTIVE</text>
    </g>

    <rect x="24" y="230" width="360" height="1" fill="#ffffff" fill-opacity="0.08"/>
  </g>

  <rect x="0" y="356" width="1280" height="4" fill="url(#accent)"/>
</svg>
